[workspace]
members = [
    # ── Layer 0: Architecture traits ──────────────────────
    "crates/arch",

    # ── Layer 1: SoC drivers ─────────────────────────────
    "crates/soc/esp32",
    "crates/soc/qemu_virt",
    "crates/soc/qemu_pc",
    "crates/soc/raspi5",

    # ── Layer 2: Kernel binaries (one per board) ─────────
    "crates/kernel/esp32c3",
    "crates/kernel/xiao_esp32c6",
    "crates/kernel/qemu_virt",
    "crates/kernel/qemu_esp32c6",
    "crates/kernel/fold_esp32c6",
    "crates/kernel/qemu_pc",
    "crates/kernel/raspi5",

    # ── Shared OS components ─────────────────────────────
    "crates/crypto",
    "crates/ssh",
    "crates/microkernel",
    "crates/distributions",
    "crates/net",
    "crates/shell",
    "crates/userlib",
    # ── Host tools ──────────────────────────────────────────
    "crates/veer-connect",
    "crates/fold_engine",
    "crates/veer_vm",
    # ── Demo / test ──────────────────────────────────────
    "crates/veeros-demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["VeerOS Contributors"]
repository = "https://github.com/veeringman/VeerOS"

[workspace.dependencies]
bitflags = "2.6"
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "proto-ipv6", "socket-tcp", "medium-ethernet", "medium-ieee802154", "proto-sixlowpan", "socket-udp", "socket-dhcpv4"] }

[profile.dev]
panic = "abort"

# Crypto must be optimized even in debug — unoptimized field math is 100x slower.
[profile.dev.package.crypto]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.ssh]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.ed25519-dalek]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.curve25519-dalek]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.sha2]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.fiat-crypto]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
#strip = "symbols"

# Crypto must NOT use opt-level="s" — size optimization can miscompile
# field arithmetic on riscv32 (u32 multiply/carry chains).
# SHA-256 also broken at opt-level=2 on riscv32; use opt-level=3.
[profile.release.package.crypto]
opt-level = 3

[profile.release.package.curve25519-dalek]
opt-level = 2

[profile.release.package.ed25519-dalek]
opt-level = 2

[profile.release.package.sha2]
opt-level = 2