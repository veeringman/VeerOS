[workspace]
members = [
    # ── Layer 0: Architecture traits ──────────────────────
    "crates/arch",

    # ── Layer 1: SoC drivers ─────────────────────────────
    "crates/soc/esp32",
    "crates/soc/qemu_virt",

    # ── Layer 2: Kernel binaries (one per board) ─────────
    "crates/kernel/xiao_esp32c6",
    "crates/kernel/qemu_virt",

    # ── Shared OS components ─────────────────────────────
    "crates/microkernel",
    "crates/distributions",
    "crates/net",
    "crates/shell",

    # ── Demo / test ──────────────────────────────────────
    "crates/veeros-demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["VeerOS Contributors"]
repository = "https://github.com/veeringman/VeerOS"

[workspace.dependencies]
bitflags = "2.6"
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "socket-tcp", "medium-ethernet"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"