[workspace]
members = [
    # ── Layer 0: Architecture traits ──────────────────────
    "crates/arch",

    # ── Layer 1: SoC drivers ─────────────────────────────
    "crates/soc/esp32",
    "crates/soc/qemu_virt",
    "crates/soc/raspi5",

    # ── Layer 2: Kernel binaries (one per board) ─────────
    "crates/kernel/esp32c3",
    "crates/kernel/xiao_esp32c6",
    "crates/kernel/qemu_virt",
    "crates/kernel/raspi5",

    # ── Shared OS components ─────────────────────────────
    "crates/crypto",
    "crates/microkernel",
    "crates/distributions",
    "crates/net",
    "crates/shell",
    "crates/userlib",

    # ── Demo / test ──────────────────────────────────────
    "crates/veeros-demo",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["VeerOS Contributors"]
repository = "https://github.com/veeringman/VeerOS"

[workspace.dependencies]
bitflags = "2.6"
smoltcp = { version = "0.11", default-features = false, features = ["proto-ipv4", "proto-ipv6", "socket-tcp", "medium-ethernet", "medium-ieee802154", "proto-sixlowpan", "socket-udp"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
#strip = "symbols"