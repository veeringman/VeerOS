[package]
name = "veer-connect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS Secure Connect — encrypted shell and file transfer"

[[bin]]
name = "veer-connect"
path = "src/main.rs"

[dependencies]
crypto = { path = "../crypto", default-features = false, features = ["sha256", "chacha20", "x25519"] }
libc = "0.2"
getrandom = "0.2"
