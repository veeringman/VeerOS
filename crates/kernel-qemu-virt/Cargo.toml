[package]
name = "kernel-qemu-virt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["dist-minimal"]
dist-minimal = ["microkernel/dist-minimal"]
dist-app = ["microkernel/dist-app"]
dist-rt = ["microkernel/dist-rt"]
dist-full = ["microkernel/dist-full"]

[dependencies]
arch = { path = "../arch" }
microkernel = { path = "../microkernel", default-features = false }
bsp-qemu-virt = { path = "../bsp-qemu-virt" }
shell = { path = "../shell" }
panic-halt = "1.0"
