[package]
name = "veer_vm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS microVMM — a lightweight KVM/HVF alternative to QEMU for running VeerOS kernels"

[[bin]]
name = "veer-vm"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.19"
kvm-bindings = "0.10"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "term", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
