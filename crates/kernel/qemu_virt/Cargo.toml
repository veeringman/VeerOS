[package]
name = "kernel-qemu-virt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS kernel for the QEMU virt RISC-V 32-bit machine"

[features]
default = ["dist-app"]

# ── Distribution profiles ────────────────────────────────────
dist-minimal = ["microkernel/dist-minimal"]
dist-app     = ["microkernel/dist-app", "shell", "net", "userlib", "samples"]
dist-rt      = ["microkernel/dist-rt"]
dist-xrt     = ["microkernel/dist-xrt", "accel"]
dist-full    = ["dist-app", "dist-xrt"]

# ── Optional components ──────────────────────────────────────
accel   = ["microkernel/accel"]
shell   = ["dep:shell"]
net     = ["dep:net", "dep:smoltcp"]
userlib = ["dep:userlib"]
samples = ["userlib"]

[dependencies]
arch = { path = "../../arch" }
microkernel = { path = "../../microkernel", default-features = false }
soc-qemu-virt = { path = "../../soc/qemu_virt" }
net = { path = "../../net", optional = true }
shell = { path = "../../shell", optional = true }
userlib = { path = "../../userlib", optional = true }
smoltcp = { workspace = true, optional = true }
panic-halt = "1.0"
