[package]
name = "kernel-esp32c3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS kernel for ESP32-C3 boards"

[features]
default = ["dist-minimal", "shell", "wifi", "ble"]

# ── Distribution profiles ────────────────────────────────────
dist-minimal = ["microkernel/dist-minimal"]
dist-app     = ["microkernel/dist-app", "shell", "wifi", "ble"]
dist-rt      = ["microkernel/dist-rt"]
dist-full    = ["dist-app", "dist-rt"]

# ── Optional components ──────────────────────────────────────
shell      = ["dep:shell"]
wifi       = ["dep:net", "dep:smoltcp"]
ble        = []

[dependencies]
arch = { path = "../../arch" }
microkernel = { path = "../../microkernel", default-features = false }
soc-esp32 = { path = "../../soc/esp32", default-features = false, features = ["c3"] }
userlib = { path = "../../userlib" }
net = { path = "../../net", optional = true }
shell = { path = "../../shell", optional = true }
smoltcp = { workspace = true, optional = true }
panic-halt = "1.0"
