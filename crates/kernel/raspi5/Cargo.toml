[package]
name = "kernel-raspi5"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS kernel for Raspberry Pi 5 (BCM2712, AArch64)"

[features]
default = ["dist-app"]

# Distribution profiles
dist-minimal = ["microkernel/dist-minimal"]
dist-app     = ["microkernel/dist-app", "shell", "userlib", "samples"]
dist-rt      = ["microkernel/dist-rt"]
dist-xrt     = ["microkernel/dist-xrt", "accel"]
dist-full    = ["dist-app", "dist-xrt"]

# Optional components
accel      = ["microkernel/accel"]
shell      = ["dep:shell"]
userlib    = ["dep:userlib"]
samples    = ["userlib"]
multi-user = ["microkernel/multi-user", "shell/multi-user"]

[dependencies]
arch = { path = "../../arch" }
microkernel = { path = "../../microkernel", default-features = false }
soc-raspi5 = { path = "../../soc/raspi5" }
shell = { path = "../../shell", optional = true }
userlib = { path = "../../userlib", optional = true }
panic-halt = "1.0"
