[package]
name = "soc-esp32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ESP32 RISC-V SoC drivers (C3/C6/H2) for VeerOS"

[features]
default = ["c6"]
c3 = ["esp-wifi-sys/esp32c3"]
c6 = ["esp-wifi-sys/esp32c6"]
h2 = ["esp-wifi-sys/esp32c6"]

[dependencies]
arch = { path = "../../arch" }
esp-wifi-sys = { version = "0.8.1", default-features = false }