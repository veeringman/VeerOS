[package]
name = "soc-esp32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ESP32 RISC-V SoC drivers (C3/C6/H2) for VeerOS"

[features]
default = ["c6"]
c3 = []
c6 = []
h2 = []

[dependencies]
arch = { path = "../../arch" }
esp-wifi-sys = { version = "0.8.1", features = ["esp32c6"] }