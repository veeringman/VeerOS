[package]
name = "soc-esp32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ESP32 RISC-V SoC drivers (C3/C6/H2) for VeerOS"

[features]
default = ["c6"]
c3 = ["dep:esp-wifi-sys", "esp-wifi-sys/esp32c3"]
c6 = ["dep:esp-wifi-sys-esp32c6"]
h2 = ["dep:esp-wifi-sys", "esp-wifi-sys/esp32c6"]

[dependencies]
arch = { path = "../../arch" }
# C3/H2 stay on the umbrella 0.8.1 crate. C6 uses gold's per-chip 0.2.0
# blobs (`libpp`/`libnet80211`/`libphy` are different files).
esp-wifi-sys = { version = "0.8.1", default-features = false, optional = true }
esp-wifi-sys-esp32c6 = { version = "0.2.0", optional = true }