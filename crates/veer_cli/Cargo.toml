[package]
name = "veer_cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS unified CLI for Aura, Fold, and service connect flows"

[[bin]]
name = "veer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
vas = { path = "../vas" }
veer_resolve = { path = "../veer_resolve" }
veer_graph = { path = "../veer_graph" }
