[package]
name = "veer_fabric_transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VeerOS Fabric transport runtime (secure, multiplexed, resumable)"

[features]
default = []
quic-backend = ["dep:quinn", "dep:tokio"]

[dependencies]
crypto = { path = "../crypto", default-features = false, features = ["chacha20", "sha256"] }
microkernel = { path = "../microkernel", default-features = false, features = ["dist-cluster"] }
serde = { version = "1", features = ["derive"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
tokio = { version = "1", features = ["io-util", "rt", "macros"], optional = true }

[dev-dependencies]
rcgen = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
